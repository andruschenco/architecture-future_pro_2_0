stages:
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

.terraform-job:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - cd envs/${ENV}

# ========================================
# DEV
# ========================================
validate:dev:
  extends: .terraform-job
  stage: validate
  variables:
    ENV: dev
  script:
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check -recursive ../..
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

plan:dev:
  extends: .terraform-job
  stage: plan
  variables:
    ENV: dev
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  script:
    - terraform init
      -backend-config="bucket=${BACKEND_BUCKET_PREFIX}-dev"
      -backend-config="key=dev/terraform.tfstate"
    - terraform plan -var-file="terraform.tfvars" -out="plan.tfplan"
  artifacts:
    paths:
      - envs/dev/plan.tfplan
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

apply:dev:
  extends: .terraform-job
  stage: apply
  variables:
    ENV: dev
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  script:
    - terraform init
      -backend-config="bucket=${BACKEND_BUCKET_PREFIX}-dev"
      -backend-config="key=dev/terraform.tfstate"
    - terraform apply -auto-approve plan.tfplan
  needs:
    - job: plan:dev
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success
  environment:
    name: dev
    action: start

# ========================================
# STAGE
# ========================================
validate:stage:
  extends: .terraform-job
  stage: validate
  variables:
    ENV: stage
  script:
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check -recursive ../..
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

plan:stage:
  extends: .terraform-job
  stage: plan
  variables:
    ENV: stage
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  script:
    - terraform init
      -backend-config="bucket=${BACKEND_BUCKET_PREFIX}-stage"
      -backend-config="key=stage/terraform.tfstate"
    - terraform plan -var-file="terraform.tfvars" -out="plan.tfplan"
  artifacts:
    paths:
      - envs/stage/plan.tfplan
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

apply:stage:
  extends: .terraform-job
  stage: apply
  variables:
    ENV: stage
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  script:
    - terraform init
      -backend-config="bucket=${BACKEND_BUCKET_PREFIX}-stage"
      -backend-config="key=stage/terraform.tfstate"
    - terraform apply -auto-approve plan.tfplan
  needs:
    - job: plan:stage
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false
  environment:
    name: stage
    action: start

# ========================================
# PROD
# ========================================
validate:prod:
  extends: .terraform-job
  stage: validate
  variables:
    ENV: prod
  script:
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check -recursive ../..
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

plan:prod:
  extends: .terraform-job
  stage: plan
  variables:
    ENV: prod
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  script:
    - terraform init
      -backend-config="bucket=${BACKEND_BUCKET_PREFIX}-prod"
      -backend-config="key=prod/terraform.tfstate"
    - terraform plan -var-file="terraform.tfvars" -out="plan.tfplan"
  artifacts:
    paths:
      - envs/prod/plan.tfplan
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

apply:prod:
  extends: .terraform-job
  stage: apply
  variables:
    ENV: prod
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  script:
    - terraform init
      -backend-config="bucket=${BACKEND_BUCKET_PREFIX}-prod"
      -backend-config="key=prod/terraform.tfstate"
    - terraform apply -auto-approve plan.tfplan
  needs:
    - job: plan:prod
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: false
  environment:
    name: prod
    action: start